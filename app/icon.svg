<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 15 70 70">
  <!-- Favicon: opaque dark ground + tightened crop so the mark stays legible
       at 16px in a search result. Geometry copied from
       public/logos/ridox-studio-logo.svg (Variant 7). Regenerate the raster
       siblings (icon.png, favicon.ico) with `npm run favicons`. -->
  <rect x="15" y="15" width="70" height="70" fill="#080612" />
  <defs>
    <mask id="slash-cutout">
      <rect x="15" y="15" width="70" height="70" fill="#ffffff" />
      <path d="M 48,15 L 56,15 L 40,85 L 32,85 Z" fill="#000000" />
    </mask>
  </defs>
  <g mask="url(#slash-cutout)">
    <path d="M 22,22 L 70,22 L 44,78 L 22,78 Z" fill="hsl(33, 95%, 52%)" />
    <path d="M 56,22 L 78,22 L 78,78 L 30,78 Z" fill="hsl(258, 89%, 62%)" opacity="0.9" />
  </g>
</svg>
